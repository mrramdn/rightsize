schema_version: "1.1"
name: routes-boost-changes-to-source
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The plan recognises the <laravel-boost-guidelines> block as generated by Laravel Boost and rewritten by
  `php artisan boost:update`, so it proposes changes at the source (a guideline in .ai/guidelines/ that
  overrides a built-in one, or excluding a guideline in Boost's config) rather than editing the block. It
  reports that `composer run dev` doesn't exist in composer.json, keeps the two project notes above the block
  (UTC booking times, integer price_cents), and changes no files.
